name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Android Environment
        run: flutter doctor -v

      - name: Install Monorepo Package Dependencies
        run: |
          for pkg in packages/project_model packages/timeline_engine packages/editing_commands packages/media_bridge apps/mobile; do
            echo "Resolving dependencies in $pkg..."
            (cd $pkg && flutter pub get)
          done

      - name: Run Test Suite
        run: |
          echo "Running tests in domain packages..."
          (cd packages/editing_commands && flutter test)
          (cd packages/media_bridge && flutter test)
          (cd packages/project_model && flutter test)
          (cd packages/timeline_engine && flutter test)
          echo "Running mobile app tests..."
          (cd apps/mobile && flutter test)

      - name: Build Debug APK
        run: |
          cd apps/mobile
          flutter build apk --debug
          cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/rangyantra-studio-debug.apk

      - name: Build Release APK
        run: |
          cd apps/mobile
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/rangyantra-studio-release.apk

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rangyantra-studio-apks
          path: |
            apps/mobile/build/app/outputs/flutter-apk/rangyantra-studio-debug.apk
            apps/mobile/build/app/outputs/flutter-apk/rangyantra-studio-release.apk

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/mobile/build/app/outputs/flutter-apk/rangyantra-studio-debug.apk
            apps/mobile/build/app/outputs/flutter-apk/rangyantra-studio-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
