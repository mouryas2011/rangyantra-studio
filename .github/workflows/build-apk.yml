name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Android SDK Tools & Licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "platforms;android-35" "platforms;android-36" "build-tools;36.0.0" || true
          flutter doctor -v

      - name: Install Monorepo Dependencies
        run: |
          for pkg in packages/project_model packages/timeline_engine packages/editing_commands packages/media_bridge apps/mobile; do
            echo "Resolving dependencies in $pkg..."
            (cd $pkg && flutter pub get)
          done

      - name: Run Test Suite
        run: |
          echo "Running tests in domain packages..."
          (cd packages/editing_commands && flutter test)
          (cd packages/media_bridge && flutter test)
          (cd packages/project_model && flutter test)
          (cd packages/timeline_engine && flutter test)
          echo "Running mobile app tests..."
          (cd apps/mobile && flutter test)

      - name: Build Release APK
        run: |
          cd apps/mobile
          flutter build apk --release > build_release.log 2>&1 || {
            echo "::error::Release APK build failed"
            tail -n 120 build_release.log
            echo "### ❌ Build Release Failure Log" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 build_release.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }
          echo "==== Search for built APKs ===="
          find /home/runner/work -name "*.apk" -ls || true
          mkdir -p build/app/outputs/flutter-apk
          RELEASE_APK=$(find /home/runner/work -name "*release*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ]; then
            cp -v "$RELEASE_APK" build/app/outputs/flutter-apk/rangyantra-studio-release.apk
          else
            echo "::error::No release APK was found"
            exit 1
          fi

      - name: Build Debug APK
        run: |
          cd apps/mobile
          flutter build apk --debug > build_debug.log 2>&1 || {
            echo "::error::Debug APK build failed"
            tail -n 120 build_debug.log
            echo "### ❌ Build Debug Failure Log" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 build_debug.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }
          mkdir -p build/app/outputs/flutter-apk
          DEBUG_APK=$(find /home/runner/work -name "*debug*.apk" | head -n 1)
          if [ -n "$DEBUG_APK" ]; then
            cp -v "$DEBUG_APK" build/app/outputs/flutter-apk/rangyantra-studio-debug.apk
          else
            echo "::error::No debug APK was found"
            exit 1
          fi

      - name: Upload Build Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: apps/mobile/*.log

      - name: Push Error Log to Branch on Failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-logs || git checkout ci-logs
          git rm -rf . || true
          cp apps/mobile/*.log . 2>/dev/null || true
          git add *.log
          git commit -m "ci: diagnostic build logs" || true
          git push -f origin ci-logs || true

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rangyantra-studio-apks
          path: |
            apps/mobile/build/app/outputs/flutter-apk/rangyantra-studio-release.apk
            apps/mobile/build/app/outputs/flutter-apk/rangyantra-studio-debug.apk

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          tag_name: ${{ github.ref_name }}
          name: RangYantra Studio ${{ github.ref_name }}
          files: |
            apps/mobile/build/app/outputs/flutter-apk/rangyantra-studio-release.apk
            apps/mobile/build/app/outputs/flutter-apk/rangyantra-studio-debug.apk
          generate_release_notes: true
          draft: false
          prerelease: false
