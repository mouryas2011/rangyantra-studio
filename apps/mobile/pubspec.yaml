name: rangyantra_mobile
description: "RangYantra Studio - Professional Mobile Video Editing & Motion Graphics Application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Internal Architecture Packages
  project_model:
    path: ../../packages/project_model
  timeline_engine:
    path: ../../packages/timeline_engine
  editing_commands:
    path: ../../packages/editing_commands
  media_bridge:
    path: ../../packages/media_bridge

  # Persistence & Database
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4
  path_provider: ^2.1.5
  path: ^1.9.0

  # Utilities
  uuid: ^4.6.0
  intl: ^0.20.2
  flutter_svg: ^2.0.17
  file_picker: ^8.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/icons/
    - assets/splash/
