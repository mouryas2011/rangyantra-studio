<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320">
  <defs>
    <!-- Background Gradient -->
    <rect id="bg" width="1000" height="320" fill="#080B10"/>

    <!-- Saffron Flare Gradient -->
    <linearGradient id="pSaffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC857"/>
      <stop offset="40%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#E05300"/>
    </linearGradient>

    <!-- Electric Cyan Gradient -->
    <linearGradient id="pCyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#006699"/>
      <stop offset="60%" stop-color="#00D9FF"/>
      <stop offset="100%" stop-color="#70EFFF"/>
    </linearGradient>

    <!-- Center Prismatic Play Crest Gradient -->
    <linearGradient id="pPrismGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#FFC857"/>
      <stop offset="70%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#00D9FF"/>
    </linearGradient>

    <filter id="pGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left: Symbol Scaled to 240x240 inside (40, 40) -->
  <g transform="translate(40, 40) scale(0.46875)">
    <!-- Film Sprocket Rings -->
    <circle cx="256" cy="256" r="210" stroke="#263341" stroke-width="3" fill="none" stroke-dasharray="14 10" opacity="0.6"/>
    <circle cx="256" cy="256" r="186" stroke="#263341" stroke-width="3" fill="none" stroke-dasharray="8 16" opacity="0.6"/>

    <!-- Cyan Film Strip Arc -->
    <path d="M 124 168 C 98 220, 96 300, 142 356 C 188 412, 276 434, 344 402 C 310 398, 250 380, 214 340 C 174 294, 172 230, 196 172 Z"
          fill="url(#pCyanGrad)" />

    <!-- Sprockets -->
    <g fill="#080B10">
      <rect x="110" y="230" width="12" height="18" rx="3" transform="rotate(-15 116 239)"/>
      <rect x="122" y="280" width="12" height="18" rx="3" transform="rotate(10 128 289)"/>
      <rect x="150" y="330" width="12" height="18" rx="3" transform="rotate(35 156 339)"/>
      <rect x="196" y="370" width="12" height="18" rx="3" transform="rotate(60 202 379)"/>
      <rect x="254" y="392" width="12" height="18" rx="3" transform="rotate(82 260 401)"/>
    </g>

    <!-- Saffron Film Strip Arc -->
    <path d="M 388 344 C 414 292, 416 212, 370 156 C 324 100, 236 78, 168 110 C 202 114, 262 132, 298 172 C 338 218, 340 282, 316 340 Z"
          fill="url(#pSaffronGrad)" />

    <!-- Sprockets -->
    <g fill="#080B10">
      <rect x="390" y="264" width="12" height="18" rx="3" transform="rotate(165 396 273)"/>
      <rect x="378" y="214" width="12" height="18" rx="3" transform="rotate(190 384 223)"/>
      <rect x="350" y="164" width="12" height="18" rx="3" transform="rotate(215 356 173)"/>
      <rect x="304" y="124" width="12" height="18" rx="3" transform="rotate(240 310 133)"/>
      <rect x="246" y="102" width="12" height="18" rx="3" transform="rotate(262 252 111)"/>
    </g>

    <!-- Prismatic Dynamic Center Play Triangle -->
    <g filter="url(#pGlow)">
      <path d="M 216 168 L 344 248 C 356 256, 356 264, 344 272 L 216 352 C 202 360, 190 354, 190 338 L 190 182 C 190 166, 202 160, 216 168 Z"
            fill="url(#pPrismGrad)"/>
      <path d="M 194 182 L 340 254 L 242 278 L 194 330 Z" fill="#FFFFFF" opacity="0.3"/>
    </g>
  </g>

  <!-- Right: Wordmark & Typography -->
  <g transform="translate(320, 0)">
    <!-- Primary Title: RANGYANTRA -->
    <text x="0" y="132" font-family="'Inter', 'Helvetica Neue', 'Segoe UI', sans-serif" font-size="64" font-weight="900" letter-spacing="4" fill="#F5F7FA">
      RANG<tspan fill="#FF7A00">YANTRA</tspan>
    </text>

    <!-- Sub-Brand: STUDIO with Cyan Tag Badge -->
    <rect x="528" y="82" width="118" height="32" rx="6" fill="#00D9FF" opacity="0.15"/>
    <rect x="528" y="82" width="118" height="32" rx="6" stroke="#00D9FF" stroke-width="1.5" fill="none"/>
    <text x="587" y="104" font-family="'Inter', 'Segoe UI', sans-serif" font-size="16" font-weight="800" letter-spacing="3" fill="#00D9FF" text-anchor="middle">
      STUDIO
    </text>

    <!-- Hindi Name -->
    <text x="0" y="180" font-family="'Noto Sans Devanagari', 'Segoe UI', sans-serif" font-size="24" font-weight="600" letter-spacing="2" fill="#FFC857">
      रंगयंत्र स्टूडियो
    </text>

    <!-- Cinema Divider Line -->
    <line x1="0" y1="206" x2="640" y2="206" stroke="#263341" stroke-width="2"/>
    <line x1="0" y1="206" x2="160" y2="206" stroke="#FF7A00" stroke-width="2"/>
    <line x1="160" y1="206" x2="260" y2="206" stroke="#00D9FF" stroke-width="2"/>

    <!-- Tagline (English & Hindi) -->
    <text x="0" y="244" font-family="'Inter', 'Segoe UI', sans-serif" font-size="20" font-weight="500" letter-spacing="1.5" fill="#A9B4C2">
      FROM IMAGINATION TO CINEMA
      <tspan fill="#FFC857" font-weight="700"> • </tspan>
      <tspan font-family="'Noto Sans Devanagari', sans-serif" font-size="19" fill="#A9B4C2">कल्पना से सिनेमा तक</tspan>
    </text>
  </g>
</svg>
